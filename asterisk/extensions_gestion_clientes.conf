; Gestion de Clientes - reviewed example for Asterisk 11.
; Include this file manually from extensions_custom.conf only in an approved window.
;
; AMI originates SIP/<agent> into this context.  The customer leg is then sent
; through from-internal so the installation's normal outbound routes still apply.
[gestion-clientes-outbound]
exten => _X!,1,NoOp(Gestion Clientes attempt ${GC_ATTEMPT_ID})
 same => n,GotoIf($[${REGEX("^[0-9]{1,32}$" ${EXTEN})} = 1]?valid:invalid)
 same => n(valid),GotoIf($[${REGEX("^[0-9a-fA-F-]{36}$" ${GC_ATTEMPT_ID})} = 1]?tag:invalid)
 same => n(tag),Set(CDR(accountcode)=GC-${GC_ATTEMPT_ID})
 same => n,Set(CDR(userfield)=GC-${GC_ATTEMPT_ID})
 same => n,Set(__GC_ATTEMPT_ID=${GC_ATTEMPT_ID})
 same => n,Set(__GC_ACCOUNT_CODE=GC-${GC_ATTEMPT_ID})
 same => n,Dial(Local/${EXTEN}@gestion-clientes-route/n,60)
 same => n,Hangup()
 same => n(invalid),Verbose(1,Gestion Clientes rejected invalid originate variables)
 same => n,Hangup(21)

; The Local channel receives inherited __GC_* variables, tags its own CDR, and
; only then enters the normal outbound-routing context.
[gestion-clientes-route]
exten => _X!,1,Set(CDR(accountcode)=${GC_ACCOUNT_CODE})
 same => n,Set(CDR(userfield)=${GC_ACCOUNT_CODE})
 same => n,Goto(from-internal,${EXTEN},1)
